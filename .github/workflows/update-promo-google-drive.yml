name: Auto Update Promo Calculator from Google Drive

on:
  schedule:
    # Cek Google Drive setiap 5 menit
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promo-calculator-google-drive-sync
  cancel-in-progress: true

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest Excel from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
          DOWNLOAD_PATH: Calculator Promo.xlsx
        run: python scripts/sync_google_drive.py

      - name: Build public data
        run: python build_static.py

      - name: Commit only generated website data
        run: |
          git config user.name "Promo Calculator Bot"
          git config user.email "promo-calculator-bot@users.noreply.github.com"

          git add public/data.json public/index.html public/README-NETLIFY.txt

          if git diff --cached --quiet; then
            echo "No promo data changes detected. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: auto-update promo data from Google Drive"
          git push
