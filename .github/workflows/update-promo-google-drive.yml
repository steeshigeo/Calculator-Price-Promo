name: Auto Update Promo from Google Drive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: promo-google-drive-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-build:
    name: sync-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Download latest Excel from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        run: |
          python scripts/sync_google_drive.py

      - name: Build public data
        run: |
          python build_static.py

      - name: Commit only generated website data
        run: |
          git config user.name "Promo Calculator Bot"
          git config user.email "promo-calculator-bot@users.noreply.github.com"

          git add public/

          if git diff --cached --quiet; then
            echo "No generated website data changes."
            exit 0
          fi

          echo "Generated website data changed."

          git commit -m "chore: auto-update promo data from Google Drive"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
