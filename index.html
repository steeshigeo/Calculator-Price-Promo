<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b5cff">
<title>Kalkulator Promo Apple</title>
<style>
:root{
  --bg:#eef5ff;--card:#fff;--ink:#10213f;--muted:#6d7d99;--line:#d8e4f4;
  --blue:#0b5cff;--blue2:#0a84ff;--blue-soft:#e9f2ff;--navy:#0b1f45;--good:#0f9d69;
  --shadow:0 12px 35px rgba(24,65,130,.11);--shadow-sm:0 5px 18px rgba(24,65,130,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#eff6ff 0%,#f7faff 42%,#edf4ff 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
button,input,select{font:inherit}
.app{max-width:820px;margin:0 auto;padding-bottom:112px}
.top{position:sticky;top:0;z-index:30;background:rgba(246,250,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(210,224,245,.72)}
.topin{padding:12px 14px 10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brandleft{display:flex;align-items:center;gap:10px}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0b5cff,#4eb4ff);box-shadow:0 8px 20px rgba(11,92,255,.25);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.title{font-weight:900;font-size:19px;letter-spacing:-.45px}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.refresh{border:1px solid #d8e7fb;background:#fff;color:#17427f;box-shadow:var(--shadow-sm);padding:9px 11px;border-radius:12px;font-weight:800;font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.tab{border:1px solid #d5e3f6;background:#fff;color:#3c5375;border-radius:13px;padding:10px 6px;font-size:12px;font-weight:850;box-shadow:0 3px 10px rgba(50,91,150,.05);transition:.18s}.tab.active{background:linear-gradient(135deg,#0b5cff,#0a84ff);color:#fff;border-color:#0b5cff;box-shadow:0 8px 18px rgba(11,92,255,.22);transform:translateY(-1px)}
main{padding:14px}
.hero{background:linear-gradient(135deg,#0b5cff 0%,#176eff 56%,#50b6ff 100%);color:#fff;border-radius:22px;padding:18px;box-shadow:0 16px 35px rgba(11,92,255,.22);margin-bottom:12px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.10);right:-72px;top:-92px}.hero-kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.8;font-weight:800}.hero-title{font-size:25px;font-weight:900;letter-spacing:-.8px;margin-top:4px}.hero-sub{font-size:12px;line-height:1.55;opacity:.92;max-width:600px;margin-top:5px}.hero-badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.badge{padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);font-size:10px;font-weight:800}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#0b5cff,#62c0ff)}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.step{width:30px;height:30px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:12px}.section-title{font-size:13px;font-weight:900;letter-spacing:.4px;text-transform:uppercase}.section-sub{font-size:10px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:6px}.label{font-size:11px;font-weight:850;color:#466184}.control{width:100%;height:46px;border:1px solid #c9d9ef;border-radius:13px;padding:0 12px;background:#fbfdff;font-size:14px;outline:none;color:#11284e;box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}.control:focus{border-color:#6da8ff;box-shadow:0 0 0 4px rgba(11,92,255,.10)}input.control{text-align:right}
.mini-note{margin-top:8px;background:#f1f7ff;border:1px dashed #c9dcf7;color:#547092;border-radius:12px;padding:9px 10px;font-size:11px;line-height:1.45}
.pricebox{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.stat{border:1px solid #d8e5f5;border-radius:15px;padding:12px;background:linear-gradient(180deg,#fbfdff,#f5f9ff)}.stat .k{font-size:10px;color:#7387a3;font-weight:700}.stat .v{font-size:19px;font-weight:900;margin-top:4px;letter-spacing:-.35px}.stat.promo{background:linear-gradient(180deg,#eef6ff,#e3efff);border-color:#b9d5ff}.promo .v{color:#0b5cff}.save{font-size:11px;color:var(--good);font-weight:900;margin-top:5px}
.notice{background:#f6fbff;border:1px solid #cfe1f8;color:#406489;border-radius:13px;padding:10px;font-size:11px;line-height:1.5;margin-top:10px}.notice strong{color:#194c8e}.small{font-size:10px;color:#7588a3;margin-top:7px;line-height:1.4}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.paybtn{border:1px solid #d2e0f3;background:#fff;color:#405779;border-radius:13px;padding:11px;font-weight:900;font-size:12px}.paybtn.active{background:linear-gradient(135deg,#0b5cff,#0a84ff);color:#fff;border-color:#0b5cff;box-shadow:0 8px 18px rgba(11,92,255,.2)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pill{padding:6px 8px;border-radius:999px;background:#eef5ff;border:1px solid #cfe0f6;color:#315982;font-size:10px;font-weight:800}
.summary{background:linear-gradient(145deg,#0b1f45,#123d87);color:#fff;border:none;box-shadow:0 16px 35px rgba(11,31,69,.23)}.summary:before{background:linear-gradient(180deg,#54c0ff,#fff)}.summary .step{background:rgba(255,255,255,.12);color:#fff}.summary .section-sub{color:#b7ccef}.rows{display:flex;flex-direction:column;gap:7px}.srow{display:flex;justify-content:space-between;gap:18px;font-size:12px}.srow span:first-child{color:#c6d6f2}.srow strong{font-weight:850;text-align:right}.srow.total{border-top:1px solid rgba(255,255,255,.16);padding-top:11px;margin-top:5px;font-size:15px}.srow.total span:first-child{color:#fff}.big{font-size:31px;font-weight:950;letter-spacing:-1px;margin-top:13px}.green{color:#78f0b8!important}.strike{text-decoration:line-through;color:#90a5c6!important}.summary .tiny{font-size:10px;color:#abc1e6;line-height:1.45;margin-top:7px}
.talk{line-height:1.65;font-size:12px;white-space:pre-wrap;background:linear-gradient(180deg,#f8fbff,#eff6ff);border:1px solid #d5e4f5;border-radius:14px;padding:13px;color:#294564}.actions{position:sticky;bottom:0;z-index:25;padding:10px 14px;background:linear-gradient(transparent,rgba(239,246,255,.98) 28%);display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{height:50px;border-radius:15px;border:1px solid #bdd3f2;background:#fff;color:#17365d;font-weight:950;font-size:12px;box-shadow:var(--shadow-sm)}.action.primary{background:linear-gradient(135deg,#0b5cff,#0a84ff);color:#fff;border-color:#0b5cff}
.loading{padding:45px 20px;text-align:center;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #d4e3f6;background:#f5f9ff;color:#476789;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:800}.footer-note{font-size:10px;color:#7f91aa;text-align:center;margin:8px 0 14px;line-height:1.5}.empty{border:1px dashed #cbdcf0;background:#f7fbff;color:#69809e;border-radius:13px;padding:11px;font-size:11px}.hide{display:none!important}
@media(max-width:520px){.app{max-width:100%}.grid{grid-template-columns:1fr}.full{grid-column:auto}.pricebox{grid-template-columns:1fr 1fr}.title{font-size:17px}.hero-title{font-size:22px}.control{height:47px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topin">
 <div class="brand"><div class="brandleft"><div class="brandmark">A</div><div><div class="title">Kalkulator Promo Apple</div><div class="sub" id="updatedText">Memuat master data…</div></div></div><button class="refresh" onclick="refreshData(true)">↻ Refresh</button></div>
 <div class="tabs" id="tabs"></div>
</div></header>
<main id="app"><div class="loading">Memuat data dari master Excel…</div></main>
<div class="actions hide" id="actions"><button class="action" onclick="copyTalk()">COPY SALES TALK</button><button class="action primary" onclick="shareAll()">BAGIKAN</button></div>
</div>
<script>
let DATA=null;
let state={tab:'iPhone',group:'',connectivity:'',storage:'',tradeBrand:'',tradeModel:'',tradeGrade:'',tradein:0,payment:'financing',financing:'',dp:0,admin:0,tenor:3,card:'',qoala:'',provider:'',providerItem:''};
let lastStamp='';let timer=null;
const IDR=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Math.round(Number(n)||0));
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const arr=a=>Array.isArray(a)?a:[];
function options(list,value,placeholder='Pilih…'){return `<option value="">${placeholder}</option>`+list.map(x=>`<option value="${esc(x.value)}" ${String(x.value)===String(value)?'selected':''}>${esc(x.label)}</option>`).join('')}
function currentProducts(){return arr(DATA?.catalog?.[state.tab])}
function groups(){return [...new Set(currentProducts().map(p=>p.group))]}
function groupProducts(){return currentProducts().filter(p=>p.group===state.group)}
function isIPad(){return state.tab==='iPad'}
function normalizeConnectivity(desc){const s=String(desc||'').toLowerCase();if(/wi-?fi\s*\+?\s*cell|wf\s*cl|cellular/.test(s))return 'Wi-Fi + Cellular';if(/wi-?fi|wifi/.test(s))return 'Wi-Fi';return ''}
function connectivityOptions(){if(!isIPad())return [];return [...new Set(groupProducts().map(p=>normalizeConnectivity(p.description)).filter(Boolean))]}
function extractStorage(desc){const m=String(desc||'').match(/(\d+(?:\.\d+)?\s*(?:GB|TB))/i);return m?m[1].replace(/\s+/g,' '):String(desc||'')}
function filteredProducts(){let ps=groupProducts();if(isIPad()&&state.connectivity)ps=ps.filter(p=>normalizeConnectivity(p.description)===state.connectivity);return ps}
function storages(){return [...new Set(filteredProducts().map(p=>extractStorage(p.description)))]}
function selectedProduct(){const ps=filteredProducts();if(!ps.length)return null;return ps.find(p=>extractStorage(p.description)===state.storage)||ps[0]}
function ensureSelection(){const gs=groups();if(!gs.includes(state.group))state.group=gs[0]||'';const conns=connectivityOptions();if(!isIPad())state.connectivity='';else if(!conns.includes(state.connectivity))state.connectivity=conns[0]||'';const sts=storages();if(!sts.includes(state.storage))state.storage=sts[0]||'';ensureTradein()}
function ensureTradein(){const brands=[...new Set(arr(DATA?.trade_in).map(x=>x.brand))].sort((a,b)=>a.localeCompare(b));if(state.tradeBrand&&!brands.includes(state.tradeBrand))state.tradeBrand='';if(!state.tradeBrand)state.tradeModel='';const models=arr(DATA?.trade_in).filter(x=>x.brand===state.tradeBrand);const modelNames=[...new Set(models.map(x=>x.model))];if(!modelNames.includes(state.tradeModel))state.tradeModel=modelNames[0]||'';const rec=arr(DATA?.trade_in).find(x=>x.brand===state.tradeBrand&&x.model===state.tradeModel);const grades=rec?Object.keys(rec.grades||{}):[];if(!grades.includes(state.tradeGrade))state.tradeGrade=grades[0]||'';state.tradein=rec&&state.tradeGrade?Number(rec.grades[state.tradeGrade]||0):0}
function tradeBrands(){return [...new Set(arr(DATA.trade_in).map(x=>x.brand))].sort((a,b)=>a.localeCompare(b))}
function tradeModels(){return arr(DATA.trade_in).filter(x=>x.brand===state.tradeBrand)}
function selectedTrade(){return arr(DATA.trade_in).find(x=>x.brand===state.tradeBrand&&x.model===state.tradeModel)||null}
function tradeGrades(){const r=selectedTrade();return r?Object.entries(r.grades||{}).map(([g,v])=>({value:g,label:`Grade ${g} — ${IDR(v)}`})):[]}
function quote(){const p=selectedProduct();if(!p)return {};const device=Number(p.promo_price||p.normal_price||0);const normal=Number(p.normal_price||0);const deviceDisc=Math.max(0,normal-device);const trade=Math.max(0,Number(state.tradein)||0);let principal=Math.max(0,device-trade),upfront=0,monthly=0,methodLabel='';if(state.payment==='financing'){const dp=Math.max(0,Number(state.dp)||0),admin=Math.max(0,Number(state.admin)||0);upfront=dp;principal=Math.max(0,device-trade-dp);monthly=state.tenor?principal/state.tenor:0;methodLabel=`${state.financing||'Financing'} ${state.tenor} bulan`;}else{monthly=state.tenor?principal/state.tenor:0;methodLabel=`${state.card||'Kartu Kredit'} ${state.tenor} bulan`}
const q=DATA.qoala.find(x=>x.article===state.qoala);const qTotal=q?Number(q.repricing||q.current||q.reference||0):0;const qMonthly=q&&q.qoala_tenor===Number(state.tenor)?qTotal/state.tenor:null;const prov=DATA.providers.find(x=>x.article===state.providerItem);const provTotal=prov?Number(prov.repricing||prov.current||prov.reference||0):0;const provMonthly=state.tenor?provTotal/state.tenor:0;const admin=state.payment==='financing'?Math.max(0,Number(state.admin)||0):0;const total=Math.max(0,device-trade+admin+qTotal+provTotal);const monthlyAll=state.tenor?Math.max(0,monthly+qTotal/state.tenor+provTotal/state.tenor):0;return {p,device,normal,deviceDisc,trade,principal,upfront,monthly,methodLabel,q,qTotal,qMonthly,prov,provTotal,provMonthly,total,monthlyAll,admin}}
function setTab(t){state.tab=t;state.group=groups()[0]||'';state.connectivity='';state.storage='';state.qoala='';state.provider='';state.providerItem='';render()}
function setGroup(v){state.group=v;state.connectivity=isIPad()?(connectivityOptions()[0]||''):'';state.storage=storages()[0]||'';state.qoala='';render()}
function setConnectivity(v){state.connectivity=v;state.storage=storages()[0]||'';state.qoala='';render()}
function setTradeBrand(v){state.tradeBrand=v;state.tradeModel='';state.tradeGrade='';state.tradein=0;ensureTradein();render()}
function setTradeModel(v){state.tradeModel=v;state.tradeGrade='';ensureTradein();render()}
function setTradeGrade(v){state.tradeGrade=v;ensureTradein();refreshSummary()}
function eligibleQoala(){const p=selectedProduct();if(!p)return [];const price=Number(p.promo_price||p.normal_price||0);return arr(DATA.qoala).filter(q=>Number(q.max_device||0)>=price).sort((a,b)=>Number(a.max_device||0)-Number(b.max_device||0))}
function autoQoala(){const eligible=eligibleQoala();if(!eligible.length){state.qoala='';return}const tierMax=Number(eligible[0].max_device);const sameTier=eligible.filter(x=>Number(x.max_device)===tierMax);const keep=sameTier.find(x=>x.article===state.qoala);if(!keep){const match=sameTier.find(x=>x.qoala_tenor===Number(state.tenor));state.qoala=(match||sameTier[0]).article}}
function providerBrands(){return [...new Set(DATA.providers.map(p=>p.brand))].sort()}
function providerItems(){return DATA.providers.filter(p=>p.brand===state.provider)}
function promoDeviceText(p){return p&&p.remarks?`Promo berjalan: ${p.remarks}`:'Tidak ada catatan promo pada baris produk ini.'}
function renderTabs(){document.getElementById('tabs').innerHTML=['iPhone','iPad','Apple Watch','Mac'].map(t=>`<button class="tab ${state.tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}
function render(){ensureSelection();renderTabs();const p=selectedProduct();const gs=groups();const conns=connectivityOptions();const st=storages();if(state.payment==='financing'){if(!state.financing&&DATA.bnpl.length)state.financing=DATA.bnpl[0].name;const f=DATA.bnpl.find(x=>x.name===state.financing)||null;if(f&&!f.tenors.includes(Number(state.tenor)))state.tenor=f.tenors[0]||3}else{const c=DATA.card_options.find(x=>x.name===state.card)||DATA.card_options[0];state.card=c?.name||'';if(c&&!c.tenors.includes(Number(state.tenor)))state.tenor=c.tenors[0]||3}autoQoala();const q=quote();const qopts=eligibleQoala();if(state.provider&&!providerBrands().includes(state.provider))state.provider='';const pis=providerItems();if(state.providerItem&&!pis.some(x=>x.article===state.providerItem))state.providerItem='';const card=DATA.card_options.find(x=>x.name===state.card)||DATA.card_options[0];const f=DATA.bnpl.find(x=>x.name===state.financing)||DATA.bnpl[0];const tr=selectedTrade();
const html=`
<section class="hero"><div class="hero-kicker">Smart promo calculator</div><div class="hero-title">Simulasi ${esc(state.tab)}</div><div class="hero-sub">Pilih produk, trade in, metode pembayaran, proteksi, dan provider. Semua harga dan promo diambil dari master Excel terbaru.</div><div class="hero-badges"><span class="badge">4 kategori Apple</span><span class="badge">Trade In by Grade</span><span class="badge">Qoala Auto Range</span><span class="badge">Ready untuk HP</span></div></section>
<section class="card"><div class="section-head"><div class="step">1</div><div><div class="section-title">Pilih Device</div><div class="section-sub">Model, connectivity, storage & harga promo</div></div></div><div class="grid">
<div class="field full"><label class="label">Model Device</label><select class="control" onchange="setGroup(this.value)">${options(gs.map(x=>({value:x,label:x})),state.group,'Pilih model…')}</select></div>
${isIPad()?`<div class="field"><label class="label">Connectivity</label><select class="control" onchange="setConnectivity(this.value)">${options(conns.map(x=>({value:x,label:x})),state.connectivity,'Pilih Wi-Fi / Wi-Fi + Cellular…')}</select></div>`:''}
<div class="field"><label class="label">GB / Storage</label><select class="control" onchange="state.storage=this.value;state.qoala='';render()">${options(st.map(x=>({value:x,label:x})),state.storage,'Pilih storage…')}</select></div>
<div class="field"><label class="label">Harga Promo</label><input class="control" value="${IDR(p?.promo_price||0)}" readonly></div></div>
<div class="pricebox"><div class="stat"><div class="k">Harga Normal</div><div class="v">${IDR(p?.normal_price||0)}</div></div><div class="stat promo"><div class="k">Harga Promo</div><div class="v">${IDR(p?.promo_price||0)}</div><div class="save">Hemat ${IDR(Math.max(0,(p?.normal_price||0)-(p?.promo_price||0)))}</div></div></div>
<div class="notice"><strong>${esc(p?.description||'-')}</strong><br>${esc(promoDeviceText(p))}</div><div class="small">Article: ${esc(p?.article||'-')}</div></section>

<section class="card"><div class="section-head"><div class="step">2</div><div><div class="section-title">Trade In</div><div class="section-sub">Pilih HP lama dan grade dari master Trade in</div></div></div>
<div class="grid"><div class="field"><label class="label">Merk HP</label><select class="control" onchange="setTradeBrand(this.value)"><option value="">Tidak ada Trade In</option>${tradeBrands().map(b=>`<option value="${esc(b)}" ${b===state.tradeBrand?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
<div class="field"><label class="label">Tipe HP</label><select class="control" onchange="setTradeModel(this.value)" ${state.tradeBrand?'':'disabled'}><option value="">Pilih tipe…</option>${tradeModels().map(x=>`<option value="${esc(x.model)}" ${x.model===state.tradeModel?'selected':''}>${esc(x.model)}</option>`).join('')}</select></div>
<div class="field full"><label class="label">Grade & Harga Trade In</label><select class="control" onchange="setTradeGrade(this.value)" ${tr?'':'disabled'}><option value="">Pilih grade…</option>${tradeGrades().map(x=>`<option value="${esc(x.value)}" ${x.value===state.tradeGrade?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div></div>
<div class="pillrow">${tr?`<span class="pill">${esc(tr.brand)}</span><span class="pill">${esc(tr.model)}</span><span class="pill">Grade ${esc(state.tradeGrade)} · ${IDR(state.tradein)}</span>`:`<span class="pill">Belum memilih HP untuk Trade In</span>`}</div></section>

<section class="card"><div class="section-head"><div class="step">3</div><div><div class="section-title">Metode Pembayaran</div><div class="section-sub">Pilih Financing atau Kartu Kredit</div></div></div><div class="payrow"><button class="paybtn ${state.payment==='financing'?'active':''}" onclick="state.payment='financing';state.card='';render()">Financing</button><button class="paybtn ${state.payment==='card'?'active':''}" onclick="state.payment='card';state.financing='';render()">Kartu Kredit</button></div>
${state.payment==='financing'?`<div class="grid" style="margin-top:11px"><div class="field full"><label class="label">Financing</label><select class="control" onchange="state.financing=this.value;const z=DATA.bnpl.find(x=>x.name===this.value);state.tenor=z?.tenors?.[0]||3;autoQoala();render()">${options(DATA.bnpl.map(x=>({value:x.name,label:x.name})),state.financing,'Pilih financing…')}</select></div><div class="field"><label class="label">DP</label><input class="control" inputmode="numeric" value="${state.dp||''}" placeholder="0" oninput="state.dp=this.value;refreshSummary()"></div><div class="field"><label class="label">Biaya Admin</label><input class="control" inputmode="numeric" value="${state.admin||''}" placeholder="0" oninput="state.admin=this.value;refreshSummary()"></div><div class="field"><label class="label">Tenor</label><select class="control" onchange="state.tenor=Number(this.value);autoQoala();render()">${options((f?.tenors||[3,6,12]).map(x=>({value:x,label:x+' bulan'})),state.tenor)}</select></div><div class="field"><label class="label">Estimasi Cicilan Device / bulan</label><input class="control" value="${IDR(q.monthly)}" readonly></div></div><div class="mini-note">Bunga Financing pada master tertulis “Tergantung Akun”, jadi cicilan di sini adalah estimasi pembagian pokok setelah Trade In + DP.</div>`:`<div class="grid" style="margin-top:11px"><div class="field full"><label class="label">Kartu Kredit</label><select class="control" onchange="state.card=this.value;const c=DATA.card_options.find(x=>x.name===this.value);state.tenor=c?.tenors?.[0]||3;autoQoala();render()">${options(DATA.card_options.map(x=>({value:x.name,label:x.name})),state.card,'Pilih kartu…')}</select></div><div class="field"><label class="label">Tenor</label><select class="control" onchange="state.tenor=Number(this.value);autoQoala();render()">${options((card?.tenors||[3,6,12,18,24]).map(x=>({value:x,label:x+' bulan'})),state.tenor)}</select></div><div class="field"><label class="label">Estimasi Cicilan Device / bulan</label><input class="control" value="${IDR(q.monthly)}" readonly></div></div><div class="mini-note">Tenor mengikuti daftar kartu pada promo berjalan, termasuk pilihan 18 dan 24 bulan untuk kartu yang menyediakannya.</div>`}
</section>

<section class="card"><div class="section-head"><div class="step">4</div><div><div class="section-title">Qoala Protection</div><div class="section-sub">Otomatis mengikuti range Max Device</div></div></div><div class="field"><label class="label">Tier Qoala</label><select class="control" onchange="state.qoala=this.value;refreshSummary()"><option value="">Tidak pakai Qoala</option>${qopts.map(x=>`<option value="${esc(x.article)}" ${x.article===state.qoala?'selected':''}>${esc(x.description)} — ${IDR(x.repricing||x.current||x.reference)}</option>`).join('')}</select></div>${q.q?`<div class="pillrow"><span class="pill">Tier: ${esc(q.q.description)}</span><span class="pill">Harga: ${IDR(q.qTotal)}</span>${q.qMonthly!==null?`<span class="pill">${IDR(q.qMonthly)}/bulan</span>`:''}</div>`:`<div class="small">Contoh: device Rp15.999.000 otomatis masuk Emerald karena Max Device Emerald = Rp20.000.000.</div>`}</section>

<section class="card"><div class="section-head"><div class="step">5</div><div><div class="section-title">Provider</div><div class="section-sub">Pilih provider dan paket sesuai master</div></div></div><div class="grid"><div class="field"><label class="label">Provider</label><select class="control" onchange="state.provider=this.value;state.providerItem='';render()"><option value="">Tidak pakai Provider</option>${providerBrands().map(x=>`<option value="${esc(x)}" ${x===state.provider?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label class="label">Paket</label><select class="control" onchange="state.providerItem=this.value;refreshSummary()"><option value="">Pilih paket…</option>${pis.map(x=>`<option value="${esc(x.article)}" ${x.article===state.providerItem?'selected':''}>${esc(x.description)} — ${IDR(x.repricing||x.current||x.reference)}</option>`).join('')}</select></div></div>${q.prov?`<div class="pillrow"><span class="pill">${esc(q.prov.brand)}</span><span class="pill">${esc(q.prov.description)}</span><span class="pill">${IDR(q.provTotal)} total</span><span class="pill">${IDR(q.provMonthly)}/bulan</span></div>`:''}</section>

<section class="card summary"><div class="section-head"><div class="step">✓</div><div><div class="section-title">Rincian Simulasi</div><div class="section-sub">Ringkasan seluruh promo & komponen customer</div></div></div>${summaryHtml(q)}</section>
<section class="card"><div class="section-head"><div class="step">6</div><div><div class="section-title">Saran Sales Talk</div><div class="section-sub">Bahasa yang siap dipakai staff</div></div></div><div class="talk" id="salesTalk">${esc(salesTalk(q))}</div></section>
<section class="card"><div class="section-head"><div class="step">i</div><div><div class="section-title">Master & Promo</div><div class="section-sub">Sumber data kalkulator</div></div></div><div class="chips"><span class="chip">${esc(DATA.source_file)}</span><span class="chip">${esc(String(DATA.updated_at||'').replace('T',' '))}</span><span class="chip">${Object.values(DATA.catalog||{}).reduce((a,b)=>a+b.length,0)} SKU Apple</span><span class="chip">${DATA.trade_in?.length||0} Trade In</span></div>${DATA.promo_notes.filter(x=>x.text.length>20).slice(0,8).map(x=>`<details style="margin-top:8px"><summary style="font-size:11px;font-weight:850;color:#345779">Promo / Info</summary><div class="notice">${esc(x.text)}</div></details>`).join('')}</section>
<div class="footer-note">Local: Excel dibaca oleh server lokal. Netlify: kalkulator membaca data.json hasil build. Ganti master Excel lalu build/deploy ulang agar promo publik ikut berubah.</div>`;
 document.getElementById('app').innerHTML=html;document.getElementById('actions').classList.remove('hide')}
function summaryHtml(q){if(!q.p)return '<div class="empty">Pilih device terlebih dahulu.</div>';return `<div class="rows"><div class="srow"><span>Harga normal</span><strong class="strike">${IDR(q.normal)}</strong></div><div class="srow"><span>Potongan promo device</span><strong class="green">-${IDR(q.deviceDisc)}</strong></div><div class="srow"><span>Harga device promo</span><strong>${IDR(q.device)}</strong></div><div class="srow"><span>Trade In ${state.tradeGrade?`(Grade ${esc(state.tradeGrade)})`:''}</span><strong>-${IDR(q.trade)}</strong></div>${state.payment==='financing'?`<div class="srow"><span>DP</span><strong>-${IDR(q.upfront)}</strong></div><div class="srow"><span>Biaya Admin</span><strong>+${IDR(q.admin)}</strong></div>`:`<div class="srow"><span>Cicilan kartu</span><strong>${IDR(q.monthly)} / bulan</strong></div>`}<div class="srow"><span>Qoala</span><strong>+${IDR(q.qTotal)}</strong></div><div class="srow"><span>Provider</span><strong>+${IDR(q.provTotal)}</strong></div><div class="srow total"><span>Total Harga Final Customer</span><strong>${IDR(q.total)}</strong></div><div class="srow"><span>Estimasi beban / bulan</span><strong>${IDR(q.monthlyAll)}</strong></div></div><div class="big">${IDR(q.monthlyAll)} / bulan</div><div class="tiny">Metode: ${esc(q.methodLabel)}${q.q&&q.qMonthly===null?' • plan Qoala yang dipilih memiliki tenor berbeda dari tenor pembayaran':''}</div>`}
function salesTalk(q){if(!q.p)return 'Pilih device untuk menghasilkan sales talk.';let s=`Kak, untuk ${q.p.description}, harga normalnya ${IDR(q.normal)} dan harga promonya ${IDR(q.device)}, jadi hemat ${IDR(q.deviceDisc)}.`;if(q.trade)s+=`\n\nTrade In HP ${state.tradeBrand} ${state.tradeModel} Grade ${state.tradeGrade} senilai ${IDR(q.trade)} bisa langsung mengurangi nilai yang perlu dibayar.`;if(state.payment==='financing')s+=`\n\nPembayarannya menggunakan ${state.financing||'financing'} selama ${state.tenor} bulan. DP ${IDR(q.upfront)} dan biaya admin ${IDR(q.admin)}. Estimasi cicilan pokok sekitar ${IDR(q.monthly)} per bulan, sedangkan bunga mengikuti akun customer.`;else s+=`\n\nUntuk kartu ${state.card||'yang dipilih'}, tersedia tenor ${state.tenor} bulan dengan skema cicilan sesuai promo berjalan.`;if(q.q)s+=`\n\nUntuk proteksi, sistem memilih ${q.q.description} karena harga device masuk dalam range Max Device tersebut. Nilai proteksinya ${IDR(q.qTotal)}${q.qMonthly!==null?` atau sekitar ${IDR(q.qMonthly)} per bulan`:''}.`;if(q.prov)s+=`\n\nCustomer juga memilih paket ${q.prov.description} dari ${q.prov.brand}, dengan biaya ${IDR(q.provTotal)} total atau sekitar ${IDR(q.provMonthly)} per bulan.`;s+=`\n\nJadi customer mendapatkan kombinasi harga promo device, opsi Trade In, metode pembayaran yang sesuai cashflow, serta proteksi dan layanan tambahan. Estimasi beban per bulan sekitar ${IDR(q.monthlyAll)}.`;return s}
function refreshSummary(){const el=document.querySelector('.summary');if(!el)return;const q=quote();el.innerHTML=`<div class="section-head"><div class="step">✓</div><div><div class="section-title">Rincian Simulasi</div><div class="section-sub">Ringkasan seluruh promo & komponen customer</div></div></div>`+summaryHtml(q);const t=document.getElementById('salesTalk');if(t)t.textContent=salesTalk(q)}
async function copyTalk(){const text=salesTalk(quote());try{await navigator.clipboard.writeText(text);alert('Sales talk berhasil dicopy.')}catch(e){prompt('Copy Sales Talk:',text)}}
async function shareAll(){const q=quote();const text=`KALKULATOR PROMO APPLE\n\nDevice: ${q.p?.description||'-'}\nHarga normal: ${IDR(q.normal)}\nHarga promo: ${IDR(q.device)}\nTrade In: ${state.tradeBrand?state.tradeBrand+' / '+state.tradeModel+' / Grade '+state.tradeGrade+' = '+IDR(q.trade):'Tidak dipilih'}\nMetode: ${q.methodLabel||'-'}\nQoala: ${q.q?q.q.description+' — '+IDR(q.qTotal):'Tidak dipilih'}\nProvider: ${q.prov?q.prov.description+' — '+IDR(q.provTotal):'Tidak dipilih'}\nTotal final: ${IDR(q.total)}\nEstimasi / bulan: ${IDR(q.monthlyAll)}\n\nSALES TALK\n${salesTalk(q)}`;if(navigator.share){try{await navigator.share({title:'Simulasi Promo Apple',text})}catch(e){}}else{try{await navigator.clipboard.writeText(text);alert('Rincian sudah dicopy.')}catch(e){prompt('Bagikan rincian:',text)}}}
async function fetchData(){const urls=['/api/data?ts='+Date.now(),'data.json?ts='+Date.now()];let err=null;for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){err=e}}throw err||new Error('Tidak dapat membaca master data.')}
async function refreshData(show=false){try{const d=await fetchData();if(d.ok===false)throw new Error(d.error);const stamp=d.updated_at+'|'+JSON.stringify({n:Object.values(d.catalog||{}).reduce((a,b)=>a+b.length,0),p:(d.providers||[]).length,c:(d.card_options||[]).length,t:(d.trade_in||[]).length});const first=!lastStamp;const changed=lastStamp&&lastStamp!==stamp;DATA=d;lastStamp=stamp;document.getElementById('updatedText').textContent=`${d.source_file||'Master Data'} • ${String(d.updated_at||'').replace('T',' ')}`;if(first){ensureSelection();render()}else if(changed){ensureSelection();render()}}catch(e){document.getElementById('updatedText').textContent='Gagal membaca master data';if(show)document.getElementById('app').innerHTML=`<div class="card"><div class="notice">${esc(e.message)}</div></div>`}}
refreshData(true);timer=setInterval(()=>refreshData(false),10000);
</script>
